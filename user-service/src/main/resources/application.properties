# Server Configuration
server.port=8082

# Spring Application Name
spring.application.name=user-service

# H2 Database Configuration
#H2 Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/EventHub?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abuthedog23@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


## Eureka Client Configuration

# Bypass the Eureka server for now

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.instance.prefer-ip-address=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.eventorganizer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventorganizer.shared.events